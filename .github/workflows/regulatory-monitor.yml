name: Regulatory Monitor
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Initialize source baselines without creating review proposals
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  issues: write
concurrency:
  group: regulatory-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, token: \${{ secrets.GITHUB_TOKEN }}}
      - name: Install PDF extraction support
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Load prior monitor state
        run: |
          git fetch origin monitor-state:refs/remotes/origin/monitor-state || true
          if git show origin/monitor-state:monitor-state.json > monitor-state.json 2>/dev/null; then echo "Loaded prior state."; else echo "{}" > monitor-state.json; fi
      - name: Run regulatory monitor
        env: {MONITOR_STATE_PATH: monitor-state.json, MONITOR_OUTPUT_DIR: monitor-results}
        run: |
          if [ "\${{ inputs.bootstrap }}" = "true" ]; then node monitor/index.mjs --bootstrap; else node monitor/index.mjs; fi
      - name: Run all tests
        run: npm test && npm run monitor:test
      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-monitor-\${{ github.run_id }}
          path: monitor-results/
          retention-days: 90
      - name: Publish state branch
        env: {GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}}
        run: |
          git config user.name "HPP Regulatory Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin monitor-state:refs/remotes/origin/monitor-state || true
          cp monitor-state /tmp/hpp-monitor-state
          if git show origin/monitor-state:monitor-state.json >/dev/null 2>&1; then git checkout -B monitor-state origin/monitor-state; else git checkout --orphan monitor-state; git rm -rf . >/dev/null 2>&1 || true; fi
          cp /tmp/hpp-monitor-state monitor-state.json
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "chore: update regulatory monitor state"
          git push origin monitor-state --force
      - name: Create review issue
        env: {GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}}
        run: |
          node -e "const x=require('./monitor-results/review-required.json'); if(x.length) console.log('Review required for '+x.length+' source change(s). See workflow artifact.');"
