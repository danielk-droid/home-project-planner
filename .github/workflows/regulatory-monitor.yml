name: Regulatory Monitor

on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Initialize source baselines without creating review proposals
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Install PDF extraction support
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load prior monitor state
        run: |
          git fetch origin monitor-state:refs/remotes/origin/monitor-state || true
          if git show origin/monitor-state:monitor-state.json > monitor-state.json 2>/dev/null; then
            echo "Loaded prior state."
          else
            echo "{}" > monitor-state.json
          fi

      - name: Run regulatory monitor
        env:
          MONITOR_STATE_PATH: monitor-state.json
          MONITOR_OUTPUT_DIR: monitor-results
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            node monitor/index.mjs --bootstrap
          elif [ ! -s monitor-state.json ] || [ "$(cat monitor-state.json)" = "{}" ]; then
            node monitor/index.mjs --bootstrap
          else
            node monitor/index.mjs
          fi

      - name: Run all tests
        run: npm test && npm run monitor:test

      - name: Upload monitoring report
        uses: actions/upload-artifact@v4
        with:
          name: regulatory-monitor-${{ github.run_id }}
          path: monitor-results/
          retention-days: 90

      - name: Publish state branch
        run: |
          cp monitor-state.json /tmp/hpp-monitor-state.json
          git config user.name "HPP Regulatory Monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin monitor-state:refs/remotes/origin/monitor-state || true
          if git show origin/monitor-state:monitor-state.json >/dev/null 2>&1; then
            git checkout -B monitor-state origin/monitor-state
          else
            git checkout --orphan monitor-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/hpp-monitor-state.json monitor-state.json
          git add monitor-state.json
          git diff --cached --quiet || git commit -m "chore: update regulatory monitor state"
          git push origin monitor-state --force

      - name: Create review issue when required
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('monitor-results/review-required.json','utf8'));
          if (!x.length) process.exit(0);
          const body = [
            '# HPP regulatory review required',
            '',
            'The daily official-source monitor found '+x.length+' change(s) that may affect HPP.',
            '',
            ...x.map(p => [
              '## '+p.title,
              '- Classification: '+p.classification,
              '- Source: '+p.sourceUrl,
              '- Affected rules: '+(p.affectedRuleIds||[]).join(', ') || 'none',
              '- Affected questions: '+(p.affectedQuestionIds||[]).join(', ') || 'none',
              '',
              'The detailed old/new evidence is in the workflow artifact for this run.'
            ].join('\n'))
          ].join('\n');
          fs.writeFileSync('/tmp/review-body.md',body);
          NODE
          if [ -s /tmp/review-body.md ]; then
            gh issue create --title "HPP needs regulatory review — run ${{ github.run_id }}" --body-file /tmp/review-body.md || true
          fi

      - name: Optional email notification
        if: ${{ secrets.SMTP_HOST != '' && secrets.REVIEW_EMAIL_TO != '' }}
        env:
          SMTP_HOST: "${{ secrets.SMTP_HOST }}"
          SMTP_PORT: "${{ secrets.SMTP_PORT }}"
          SMTP_USERNAME: "${{ secrets.SMTP_USERNAME }}"
          SMTP_PASSWORD: "${{ secrets.SMTP_PASSWORD }}"
          REVIEW_EMAIL_TO: "${{ secrets.REVIEW_EMAIL_TO }}"
          REVIEW_EMAIL_FROM: "${{ secrets.REVIEW_EMAIL_FROM }}"
        run: python3 monitor/notify_email.py
