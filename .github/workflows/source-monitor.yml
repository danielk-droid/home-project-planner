name: HPP Source Monitor

on:
  push:
    paths:
      - "scripts/monitor-sources.mjs"
      - "tests/source-monitor.test.mjs"
      - ".github/workflows/source-monitor.yml"
      - "data/sources.json"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run automation tests
        run: node tests/source-monitor.test.mjs
      - name: Monitor official sources
        run: node scripts/monitor-sources.mjs --write-state
        env:
          MONITOR_TIMEOUT_MS: 30000
      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpp-source-monitor-${{ github.run_id }}
          path: source-monitor-output/
          if-no-files-found: error
          retention-days: 90
      - name: Commit monitor state only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-monitor/state.json
          if git diff --cached --quiet; then
            echo "No monitor-state changes."
          else
            git commit -m "chore: update source monitor state"
            git push
          fi
      - name: Flag source health or changes for review
        run: |
          node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('source-monitor-output/monitor-results.json','utf8')); console.log(JSON.stringify({changed:r.changed,unreachable:r.unreachable,reviewRequired:r.reviewRequired},null,2)); process.exit(r.unreachable ? 1 : 0)"
