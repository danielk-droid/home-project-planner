name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/core.test.mjs
      - run: node tests/reliability.test.mjs
      - run: node tests/data-integrity.test.mjs
