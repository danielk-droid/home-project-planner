<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Newton Home Project Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><strong>Newton Home Project Planner</strong><span>Evidence-backed planning prototype</span></div></header>
<main>
<section id="start" class="panel">
  <h1>Plan a home project</h1>
  <p class="muted">Describe the project, resolve the property, answer only the questions that affect the plan, and get a source-backed workflow.</p>
  <label>Newton property address<input id="address" placeholder="e.g. 130 Wheeler Road"></label>
  <label>What are you planning?<select id="projectType"><option value="basement_finish">Finish or remodel a basement</option><option value="bathroom_renovation">Renovate a bathroom</option><option value="deck">Build or replace a deck</option><option value="addition">Build a residential addition</option></select></label>
  <button id="resolve">Resolve property & continue</button>
  <div id="error" class="error hidden"></div>
</section>
<section id="questions" class="panel hidden"></section>
<section id="result" class="hidden"></section>
</main>
<script type="module" src="app.js"></script>
</body></html>
