<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newton Home Project Planner</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="site-header-inner"><a class="brand" href="#" aria-label="Home Project Planner"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 44 44"><path d="M7 20.5 22 8l15 12.5v14.2a2.3 2.3 0 0 1-2.3 2.3H9.3A2.3 2.3 0 0 1 7 34.7Z"/><path d="M15.5 37V24h13v13M18.5 29.5h7"/></svg></span><span class="brand-copy"><strong>Home Project Planner</strong><span>Newton, Massachusetts</span></span></a><span class="header-note">Evidence-backed planning</span></div></header><main>
<section id="start" class="panel"><h1>Plan a home project</h1><p class="muted">Describe the project, choose your Newton property from official GIS suggestions, answer only the questions that affect the plan, and get a source-backed workflow.</p>
<label>Newton property address<div class="address-wrap"><input id="address" autocomplete="off" placeholder="Start typing a Newton address, e.g. 130 Wheeler Road" aria-autocomplete="list" aria-controls="addressSuggestions"><div id="addressSuggestions" class="suggestions hidden" role="listbox"></div></div><p class="small">Choose an address from the official Newton GIS suggestions so you know the property is in the planner's address database. The planner checks official property data first, then asks only project-specific questions that can change the workflow. It is not a permit application or approval.</p></label>
<label>What are you planning?<select id="projectType"><option value="basement_finish">Finish or remodel a basement</option><option value="bathroom_renovation">Renovate a bathroom</option><option value="deck">Build or replace a deck</option><option value="addition">Build a residential addition</option></select></label>
<button id="resolve">Check property & continue</button><div id="error" class="error hidden"></div></section>
<section id="questions" class="panel hidden"></section><section id="result" class="hidden"></section></main><script type="module" src="app.js"></script></body></html>
